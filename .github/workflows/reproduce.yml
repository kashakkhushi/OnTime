name: Reproduce OnTime
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: olist-${{ hashFiles('data/manifest.json') }}
      - name: Reproduce from source and test offline analysis
        run: make all
      - uses: actions/upload-artifact@v4
        with:
          name: ontime-results
          path: |
            outputs/figures
            outputs/tables
            outputs/metrics.json
            docs/DECISION_MEMO.md
            data/dq_report.md
